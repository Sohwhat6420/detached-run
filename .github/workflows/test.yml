name: test
on: [push, pull_request, workflow_dispatch]
jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Zero-window test suite
        run: node test/detached-run.test.mjs
      - name: Demo (start, status, stop)
        run: node examples/demo.mjs
